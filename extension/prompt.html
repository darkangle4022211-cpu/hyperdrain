<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HyperDrain — Confirm Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #080c16;
      --card-bg: rgba(15, 22, 40, 0.96);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-glow: rgba(0, 242, 254, 0.35);
      --neon-cyan: #00f2fe;
      --neon-emerald: #05df72;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Ambient background lighting */
    .ambient-glow {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.14) 0%, transparent 70%);
      top: -100px;
      right: -80px;
      pointer-events: none;
      filter: blur(40px);
    }

    .prompt-wrapper {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 28px;
    }

    /* Header */
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--neon-cyan), #0099ff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #050a14;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.4);
    }

    .brand-text h2 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(5, 223, 114, 0.1);
      border: 1px solid rgba(5, 223, 114, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--neon-emerald);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon-emerald);
      box-shadow: 0 0 8px var(--neon-emerald);
    }

    /* Content Form */
    .dialog-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 8px 0;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    /* File Name Input */
    .text-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
      user-select: text;
    }

    .text-input:focus {
      border-color: var(--neon-cyan);
      background: rgba(0, 242, 254, 0.04);
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.2);
    }

    /* Destination Folder Picker Bar */
    .destination-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 6px 8px 6px 14px;
      transition: border-color 0.2s ease;
    }

    .destination-bar:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .dest-icon {
      color: var(--neon-cyan);
      flex-shrink: 0;
    }

    .dest-path {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: text;
    }

    .btn-browse {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--neon-cyan);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-browse:hover {
      background: rgba(0, 242, 254, 0.22);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.3);
      transform: translateY(-1px);
    }

    .btn-browse:active {
      transform: translateY(0);
    }

    /* Streams and Options Grid */
    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .pill-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }

    .pill-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 7px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      color: #fff;
    }

    .pill-btn.active {
      background: rgba(0, 242, 254, 0.15);
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 242, 254, 0.35);
      box-shadow: 0 2px 8px rgba(0, 242, 254, 0.15);
    }

    .toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .toggle-card.active {
      border-color: rgba(5, 223, 114, 0.35);
      background: rgba(5, 223, 114, 0.06);
    }

    .toggle-info {
      display: flex;
      flex-direction: column;
    }

    .toggle-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .toggle-desc {
      font-size: 10px;
      color: var(--text-muted);
    }

    .switch-pill {
      width: 38px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      position: relative;
      transition: background 0.2s ease;
    }

    .switch-pill::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      top: 3px;
      left: 3px;
      transition: transform 0.2s ease;
    }

    .toggle-card.active .switch-pill {
      background: var(--neon-emerald);
      box-shadow: 0 0 10px rgba(5, 223, 114, 0.4);
    }

    .toggle-card.active .switch-pill::after {
      transform: translateX(18px);
      background: #050a14;
    }

    /* Footer Buttons */
    .dialog-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 20px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--neon-cyan), #0099ff);
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      color: #050a14;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(0, 242, 254, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 242, 254, 0.45);
    }

    .btn-primary:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="prompt-wrapper">
    <!-- Header -->
    <header class="dialog-header">
      <div class="brand-title">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <h2>Download Confirmation</h2>
          <p id="file-size-subtitle">Detected Media Stream</p>
        </div>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>Ready</span>
      </div>
    </header>

    <!-- Body -->
    <main class="dialog-body">
      <!-- File Name -->
      <div class="field-group">
        <label class="field-label">File Name</label>
        <input type="text" id="p-filename" class="text-input" spellcheck="false" />
      </div>

      <!-- Destination Folder Bar with Native Browse -->
      <div class="field-group">
        <label class="field-label">Save Destination</label>
        <div class="destination-bar">
          <svg class="dest-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="p-targetdir-display" class="dest-path">Selecting download directory...</span>
          <button id="p-browse-btn" class="btn-browse" type="button" title="Open Ubuntu native folder chooser">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Browse...</span>
          </button>
        </div>
      </div>

      <!-- Video Quality Selector -->
      <div class="field-group" id="quality-selector-group" style="display: none;">
        <label class="field-label">Video Quality</label>
        <div class="pill-selector" id="quality-pills">
          <button type="button" class="pill-btn quality-pill active" data-quality="1080p">1080p Full HD ★</button>
          <button type="button" class="pill-btn quality-pill" data-quality="720p">720p HD</button>
          <button type="button" class="pill-btn quality-pill" data-quality="360p">360p Small</button>
          <button type="button" class="pill-btn quality-pill" data-quality="ba/bestaudio">Audio Only (MP3)</button>
        </div>
      </div>

      <!-- Options Row -->
      <div class="options-row">
        <!-- Streams Selector -->
        <div class="field-group" style="width: 100%;">
          <label class="field-label">Parallel Accelerated Streams</label>
          <div class="pill-selector">
            <button type="button" class="pill-btn stream-pill" data-streams="16">16 Streams</button>
            <button type="button" class="pill-btn stream-pill" data-streams="24">24 Streams</button>
            <button type="button" class="pill-btn stream-pill active" data-streams="32">32x Max ⚡</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="dialog-footer">
      <button id="p-cancel-btn" class="btn-secondary">Cancel</button>
      <button id="p-download-btn" class="btn-primary">
        <span>Start Download</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </button>
    </footer>
  </div>

  <script src="prompt.js"></script>
</body>
</html>
